name: CI

# Offline test suites on every PR and every push to main. Nothing here touches
# data.gouv / IGN / INSEE: keep it that way (no live run_commune step).
# See lvtshift-fr/docs/specs/0004-add-ci.md.
#   - upstream unit tests            (tests/)
#   - LVTShift-FR tests              (every lvtshift-fr/test_*.py, via pytest)
#   - LVTShift-FR plain runner       (test_units.py must also pass without pytest)
#   - LVTShift-FR synthetic end-to-end (real upstream solver)
#   - site build                     (only once lvtshift-fr/site exists)

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI never writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    env:
      PYTHONUTF8: '1'
    steps:
      # Actions pinned to full commit SHAs (supply-chain hardening).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: lvtshift-fr/requirements-ci.txt

      - name: Install dependencies
        run: pip install -r lvtshift-fr/requirements-ci.txt

      - name: Upstream unit tests
        run: python -m pytest tests/ -q

      - name: LVTShift-FR tests (pytest, all test_*.py)
        run: python -m pytest -q
        working-directory: lvtshift-fr

      - name: LVTShift-FR unit tests (plain runner, no pytest)
        run: python test_units.py
        working-directory: lvtshift-fr

      - name: LVTShift-FR synthetic end-to-end
        run: python test_synthetic.py
        working-directory: lvtshift-fr

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check for the site
        id: site
        run: |
          if [ -f lvtshift-fr/site/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No lvtshift-fr/site yet: skipping the site build."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        if: steps.site.outputs.present == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lvtshift-fr/site/package-lock.json

      - name: Install and build the site
        if: steps.site.outputs.present == 'true'
        working-directory: lvtshift-fr/site
        run: |
          npm ci
          npm run build
